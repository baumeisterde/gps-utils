<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- gps-utils: globe (world map) with a route, a satellite above it. Six colours: night blue, sea blue, land green, route orange, white, panel blue -->
  <defs><clipPath id="globe"><circle cx="29" cy="37" r="23"/></clipPath></defs>
  <rect width="64" height="64" rx="14" fill="#0d2b5e"/>
  <circle cx="29" cy="37" r="23" fill="#1e6ad0"/>
  <g clip-path="url(#globe)" fill="#43a047">
    <!-- Europe -->
    <path d="M17 22c2-3 6-4 9-3 2-2 6-2 8 0 3 0 5 2 5 4-1 2-4 2-6 3 1 2 0 4-2 4-2 2-5 1-6 3-2 1-4 0-5-2-2 0-4-1-4-3 0-2 1-4 1-6z"/>
    <!-- Africa -->
    <path d="M20 33c3-1 7-1 10 0 3 0 5 2 7 4 1 3 0 5-2 7-1 3-2 6-4 8-2 2-3 5-5 6-2-1-2-4-3-6-1-3-3-5-3-8-1-2-2-4-2-6 0-2 1-4 2-5z"/>
    <!-- Americas edge and Asia edge -->
    <path d="M2 26c3 0 5 2 6 4 0 3-1 5-3 7-1 3-1 6-2 9H0V26z"/>
    <path d="M46 24c3 1 6 3 7 6v10c-2-1-4-3-5-5-2-1-3-3-2-5-1-2-1-4 0-6z"/>
  </g>
  <!-- the route: orange with white casing, start and end points -->
  <path d="M15 27c4 2 7 5 11 5s6 4 7 8 2 7 0 10" fill="none" stroke="#fff" stroke-width="4.6" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M15 27c4 2 7 5 11 5s6 4 7 8 2 7 0 10" fill="none" stroke="#ff9800" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="15" cy="27" r="3" fill="#fff"/><circle cx="15" cy="27" r="1.6" fill="#ff9800"/>
  <circle cx="33" cy="50" r="3" fill="#ff9800" stroke="#fff" stroke-width="1.4"/>
  <!-- satellite: body, two solar panels, antenna, signal towards the globe -->
  <g transform="translate(50.5 12) rotate(35) scale(0.82)">
    <rect x="-13" y="-3.6" width="8" height="7.2" rx="0.8" fill="#90caf9" stroke="#0d2b5e" stroke-width="0.9"/>
    <path d="M-9 -3.6v7.2" stroke="#0d2b5e" stroke-width="0.8"/>
    <rect x="5" y="-3.6" width="8" height="7.2" rx="0.8" fill="#90caf9" stroke="#0d2b5e" stroke-width="0.9"/>
    <path d="M9 -3.6v7.2" stroke="#0d2b5e" stroke-width="0.8"/>
    <path d="M-5 0h10" stroke="#fff" stroke-width="1.4"/>
    <rect x="-3.4" y="-4.4" width="6.8" height="8.8" rx="1.4" fill="#fff"/>
    <path d="M0 4.4v2.4" stroke="#fff" stroke-width="1.2"/><circle cx="0" cy="7.4" r="1.1" fill="#ff9800"/>
  </g>
  <g fill="none" stroke="#fff" stroke-width="1.5" stroke-linecap="round" opacity="0.9">
    <path d="M46.6 21.7A10.5 10.5 0 0 1 41.4 17.2"/><path d="M44.6 24.7A14 14 0 0 1 38.8 19.6"/>
  </g>
</svg>
